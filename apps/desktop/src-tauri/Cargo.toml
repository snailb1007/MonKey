[workspace]

[package]
name = "monkey-desktop"
version = "0.1.0"
edition = "2021"
authors = ["MonKey Contributors"]
license = "MIT"
description = "MonKey Retro Pixel Desktop UI Native Adapter"

[lib]
name = "monkey_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "monkey-desktop"
path = "src/main.rs"

[dependencies]
monkey-core = { path = "../../../crates/monkey-core" }
tauri = { version = "2.12", default-features = false, features = ["wry", "compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
crossbeam-channel = "0.5.17"
zerocopy = "0.8.57"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
base64 = "0.22"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
tauri-build = { version = "2.7", default-features = false , features = [] }

[dev-dependencies]
tempfile = "3"
