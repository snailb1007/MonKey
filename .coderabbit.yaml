# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - "!target/**"
    - "!vendor_driver/**"
    - "!MK3075ProDriver*.exe"
    - "!**/*.lock"
    - "!**/*.pcapng"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "dev"

tone_instructions: >-
  You are an expert Rust systems engineer reviewing a keyboard driver and CLI tooling project (MonKey).
  Focus specifically on:
  1. Memory safety, panic prevention, avoiding unnecessary unwrap()/expect() in production paths.
  2. Protocol & Hardware safety rails: verify zero blind/speculative writes to SPI NOR flash, enforce RAM preview before flash commits.
  3. Timing & Pacing: ensure strict adherence to inter-chunk delays (10-25ms) for USB HID communication.
  4. Cross-platform compatibility across macOS, Linux (libudev), and Windows.
  Do not nitpick formatting or style already enforced by cargo fmt or cargo clippy.
