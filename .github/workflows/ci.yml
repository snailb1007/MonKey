name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Code Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (hidapi requirement)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain (stable with rustfmt & clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run linter (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: Security & License Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: Test (${{ matrix.os }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (x86_64)
          - os: macos-latest
            name: macOS (Apple Silicon arm64)
          - os: windows-latest
            name: Windows (x86_64)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Run test suite
        run: cargo test --workspace --verbose

  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, deny, test]
    if: always()
    steps:
      - name: Evaluate CI Pipeline Result
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.deny.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI pipeline checks failed!"
            echo "lint: ${{ needs.lint.result }}"
            echo "deny: ${{ needs.deny.result }}"
            echo "test: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All CI checks completed successfully!"
