name: Build & Release Desktop App

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (beta or stable)"
        required: false
        default: "beta"
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-frontend:
    name: Frontend Quality & Unit Tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Extract app version
        id: extract-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "App version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm run typecheck

      - name: Lint
        working-directory: apps/desktop
        run: pnpm run lint

      - name: Unit & Contract Tests
        working-directory: apps/desktop
        run: pnpm run test:unit

      - name: Build Web Frontend
        working-directory: apps/desktop
        run: pnpm run build

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: [test-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (hidapi & webkit2gtk & AppImage FUSE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Desktop Bundle
        working-directory: apps/desktop
        run: pnpm run desktop:bundle

      - name: Stage Bundle Artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ needs.test-frontend.outputs.version }}"
          mkdir -p apps/desktop/dist-bundles
          find apps/desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" -exec cp {} apps/desktop/dist-bundles/ \; || true
          if [ -d "apps/desktop/src-tauri/target/release/bundle/macos/MonKey.app" ]; then
            tar -czf "apps/desktop/dist-bundles/MonKey_${VERSION}_macOS_aarch64.app.tar.gz" -C apps/desktop/src-tauri/target/release/bundle/macos MonKey.app
          fi

      - name: Stage Bundle Artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p apps/desktop/dist-bundles
          find apps/desktop/src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} apps/desktop/dist-bundles/ \; || true
          find apps/desktop/src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} apps/desktop/dist-bundles/ \; || true

      - name: Stage Bundle Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.test-frontend.outputs.version }}"
          mkdir -p apps/desktop/dist-bundles
          find apps/desktop/src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} apps/desktop/dist-bundles/ \; || true
          find apps/desktop/src-tauri/target/release/bundle/msi -name "*.msi" -exec cp {} apps/desktop/dist-bundles/ \; || true
          if [ -f "apps/desktop/src-tauri/target/release/monkey-desktop.exe" ]; then
            7z a "apps/desktop/dist-bundles/MonKey_${VERSION}_Windows_x64_portable.zip" ./apps/desktop/src-tauri/target/release/monkey-desktop.exe
          fi

      - name: Upload Desktop Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-${{ matrix.platform }}
          path: apps/desktop/dist-bundles/*
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [test-frontend, build-desktop]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          VERSION="${{ needs.test-frontend.outputs.version }}"
          RUN_NUM="${{ github.run_number }}"
          REF="${{ github.ref_name }}"
          CHANNEL_INPUT="${{ inputs.channel }}"

          if [ "$CHANNEL_INPUT" = "stable" ] || [ -z "$CHANNEL_INPUT" -a "$REF" = "main" ]; then
            CHANNEL="stable"
            TAG_NAME="v${VERSION}"
            RELEASE_TITLE="MonKey Desktop v${VERSION}"
            IS_PRERELEASE="false"
            IS_LATEST="true"
          else
            CHANNEL="beta"
            TAG_NAME="v${VERSION}-beta.${RUN_NUM}"
            RELEASE_TITLE="MonKey Desktop v${VERSION} Preview (Beta #${RUN_NUM})"
            IS_PRERELEASE="true"
            IS_LATEST="false"
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release-assets
          ls -la
          sha256sum * > SHA256SUMS.txt
          echo "--- Checksums ---"
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.is_latest == 'true' }}
          files: |
            release-assets/*
          body: |
            ## MonKey Desktop (${{ steps.meta.outputs.channel == 'stable' && 'Stable Release' || 'Preview Beta' }})

            - **Version:** `${{ needs.test-frontend.outputs.version }}`
            - **Channel:** `${{ steps.meta.outputs.channel }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** `${{ github.sha }}`
            - **Build Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Verifying Artifacts
            Each release asset is verifiable using SHA-256:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          generate_release_notes: true
