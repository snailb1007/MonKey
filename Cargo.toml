[workspace]
members = [
    "crates/monkey-core",
    "crates/monkey-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MonKey Contributors"]

[workspace.dependencies]
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }
zerocopy = { version = "0.8.57", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
serde_json = "1.0.151"
tracing-subscriber = "0.3.23"
crc = "3.4.0"
indicatif = "0.18.6"
crossbeam-channel = "0.5.17"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ctrlc = "3.4.7"
